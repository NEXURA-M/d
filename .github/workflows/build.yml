name: Build Clean APK with Icon & Deep Link

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build APK with Icon
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.lyra.nexura "KING"
          
          # 2. Copy Web Source
          cp index.html app/www/
          
          # 3. Add Custom Icon to Config if icon.png exists
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
          fi
          
          # 4. Add Android Platform
          cd app
          cordova platform add android

          # 5. Inject mt:// Deep Link Intent Filter into AndroidManifest.xml
          PYTHON_SCRIPT=$(cat << 'EOF'
          import xml.etree.ElementTree as ET

          manifest_path = 'platforms/android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest_path)
          root = tree.getroot()

          application = root.find('application')
          activity = application.find('activity')

          # Add Intent Filter for mt:// Custom Scheme
          intent_filter = ET.SubElement(activity, 'intent-filter')
          ET.SubElement(intent_filter, 'action', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.action.VIEW'})
          ET.SubElement(intent_filter, 'category', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.category.DEFAULT'})
          ET.SubElement(intent_filter, 'category', {'{http://schemas.android.com/apk/res/android}name': 'android.intent.category.BROWSABLE'})
          ET.SubElement(intent_filter, 'data', {'{http://schemas.android.com/apk/res/android}scheme': 'mt'})

          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          EOF
          )
          python3 -c "$PYTHON_SCRIPT"
          
          # 6. Build Debug APK
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
