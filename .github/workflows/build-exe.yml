name: JoyMix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create ICO Icon from PNG
        run: |
          if (Test-Path "icon.png") {
              magick convert icon.png -define icon:auto-resize=256,128,64,48,32,16 app.ico
              Write-Host "Successfully generated app.ico"
          } else {
              Write-Host "Warning: icon.png not found."
          }

      - name: Create C# Wrapper Script
        run: |
          @'
          using System;
          using System.Diagnostics;
          using System.Windows.Forms;

          namespace JoyMixApp {
              static class Program {
                  [STAThread]
                  static void Main() {
                      Application.EnableVisualStyles();
                      Process.Start(new ProcessStartInfo {
                          FileName = "cmd.exe",
                          Arguments = "/c start msedge --app=https://joymix1.oneapp.dev",
                          WindowStyle = ProcessWindowStyle.Hidden
                      });
                  }
              }
          }
          '@ | Out-File -Encoding utf8 app.cs

      - name: Compile C# to EXE
        run: |
          if (Test-Path "app.ico") {
              C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /win32icon:app.ico /out:JoyMix.exe app.cs
          } else {
              C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /out:JoyMix.exe app.cs
          }

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoyMix-Desktop-EXE
          path: JoyMix.exe
