<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KING App Launcher</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-glow: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --accent-cyan: #00f2fe;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glow-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            z-index: 1;
            pointer-events: none;
        }
        .glow-1 { top: -50px; left: -50px; background: #00f2fe; }
        .glow-2 { bottom: -50px; right: -50px; background: #7928ca; }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            height: 88vh;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .header {
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            margin-bottom: 12px;
        }
        .app-title {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        .status-box {
            width: 100%;
            text-align: center;
            margin: auto 0;
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.05) 100%);
            border: 1px solid rgba(0, 242, 254, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.2);
        }
        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-cyan);
        }

        .target-name {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--primary-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .action-btn {
            width: 100%;
            height: 75px;
            border: none;
            border-radius: 20px;
            background: var(--primary-glow);
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.35);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .action-btn:active {
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }

        .footer {
            margin-top: 15px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <div class="container">
        <div class="header">
            <span class="badge">KING APP LAUNCHER</span>
            <div class="app-title" id="app-subtitle">Connecting to target...</div>
        </div>

        <div class="status-box">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12C20,14.4 18.9,16.5 17.2,18C15.8,16.8 14,16 12,16C10,16 8.2,16.8 6.8,18C5.1,16.5 4,14.4 4,12A8,8 0 0,1 12,4Z"/>
                </svg>
            </div>
            <div class="target-name" id="target-title">Loading...</div>
            <div class="status-text" id="status-desc">Fetching dynamic route from GitHub</div>
        </div>

        <button class="action-btn" id="launch-btn" disabled>
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">FETCHING DATA</span>
        </button>

        <div class="footer">Powered by ROCK-AI Repo Sync</div>
    </div>

    <script>
        const GITHUB_JSON_URL = "https://raw.githubusercontent.com/muhammadtaqi512q-oss/ROCK-AI/main/links.json";

        function getRouteKey() {
            // Extract from URL Search Parameters (?key=nexura or ?button=nexura)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('key')) return urlParams.get('key').toLowerCase();
            if (urlParams.has('button')) return urlParams.get('button').toLowerCase();

            // Extract from Custom Scheme Deep Link (mt://nexura)
            let href = window.location.href;
            if (href.startsWith("mt://")) {
                let path = href.replace("mt://", "").split('?')[0].split('/')[0];
                if (path) return path.toLowerCase();
            }

            // Extract Subdomain Prefix if Web View
            let hostname = window.location.hostname || "nexura";
            let parts = hostname.split('.');
            if (parts.length > 0 && parts[0] !== 'www' && parts[0] !== '') {
                return parts[0].toLowerCase();
            }

            return "nexura";
        }

        async function initApp() {
            const key = getRouteKey();
            let linkData = null;

            try {
                const response = await fetch(GITHUB_JSON_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Network error");
                const data = await response.json();

                if (Array.isArray(data)) {
                    linkData = data.find(item => item.name && item.name.toLowerCase() === key);
                } else if (data[key]) {
                    linkData = data[key];
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }

            const targetTitle = document.getElementById("target-title");
            const appSubtitle = document.getElementById("app-subtitle");
            const launchBtn = document.getElementById("launch-btn");
            const btnText = document.getElementById("btn-text");
            const btnSpinner = document.getElementById("btn-spinner");

            if (linkData) {
                const targetName = linkData.name || key.toUpperCase();
                const targetUrl = linkData.link || linkData.target_url;

                targetTitle.innerText = targetName.toUpperCase();
                appSubtitle.innerText = "Target Ready";
                btnText.innerText = "OPEN " + targetName.toUpperCase();
                btnSpinner.style.display = "none";
                launchBtn.disabled = false;

                launchBtn.onclick = () => {
                    if (targetUrl) {
                        window.open(targetUrl, '_system') || (window.location.href = targetUrl);
                    }
                };
            } else {
                targetTitle.innerText = key.toUpperCase();
                appSubtitle.innerText = "Link Not Configured";
                btnText.innerText = "NO TARGET FOUND";
                btnSpinner.style.display = "none";
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
