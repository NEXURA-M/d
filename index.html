<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING Desktop App</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --primary-glow: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --accent-cyan: #00f2fe;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Glow Background */
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.22;
            z-index: 1;
            pointer-events: none;
        }
        .glow-1 { top: -80px; left: -80px; background: #00f2fe; }
        .glow-2 { bottom: -80px; right: -80px; background: #7928ca; }

        .container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 440px;
            height: 90vh;
            max-height: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .header {
            width: 100%;
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .app-title {
            font-size: 1.05rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        .status-box {
            width: 100%;
            text-align: center;
            margin: auto 0;
        }
        .icon-wrapper {
            width: 85px;
            height: 85px;
            margin: 0 auto 22px auto;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.05) 100%);
            border: 1px solid rgba(0, 242, 254, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }
        .icon-wrapper svg {
            width: 42px;
            height: 42px;
            fill: var(--accent-cyan);
        }

        .target-name {
            font-size: 2.3rem;
            font-weight: 800;
            background: var(--primary-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .status-text {
            font-size: 0.88rem;
            color: var(--text-sub);
        }

        .action-btn {
            width: 100%;
            height: 70px;
            border: none;
            border-radius: 18px;
            background: var(--primary-glow);
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.35);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 242, 254, 0.45);
        }

        .action-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.2);
        }

        .footer {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <div class="container">
        <div class="header">
            <span class="badge">KING DESKTOP EDITION</span>
            <div class="app-title" id="app-subtitle">Initializing desktop launcher...</div>
        </div>

        <div class="status-box">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M4,2H20A2,2 0 0,1 22,4V16A2,2 0 0,1 20,18H14V20H16A1,1 0 0,1 17,21A1,1 0 0,1 16,22H8A1,1 0 0,1 7,21A1,1 0 0,1 8,20H10V18H4A2,2 0 0,1 2,16V4A2,2 0 0,1 4,2M4,4V16H20V4H4Z"/>
                </svg>
            </div>
            <div class="target-name" id="target-title">Loading...</div>
            <div class="status-text" id="status-desc">Syncing links from GitHub</div>
        </div>

        <button class="action-btn" id="launch-btn" disabled>
            <div class="spinner" id="btn-spinner"></div>
            <span id="btn-text">FETCHING DATA</span>
        </button>

        <div class="footer">Powered by ROCK-AI Desktop Engine</div>
    </div>

    <script>
        const GITHUB_JSON_URL = "https://raw.githubusercontent.com/muhammadtaqi512q-oss/ROCK-AI/main/links.json";

        function getRouteKey() {
            // Check Windows Command-Line / URL Search parameters
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('key')) return urlParams.get('key').toLowerCase();
            if (urlParams.has('button')) return urlParams.get('button').toLowerCase();

            // Extract Custom Scheme or File path
            let href = window.location.href;
            if (href.startsWith("mt://")) {
                let path = href.replace("mt://", "").split('?')[0].split('/')[0];
                if (path) return path.toLowerCase();
            }

            return "nexura";
        }

        async function initApp() {
            const key = getRouteKey();
            let linkData = null;

            try {
                const response = await fetch(GITHUB_JSON_URL + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Network error");
                const data = await response.json();

                if (Array.isArray(data)) {
                    linkData = data.find(item => item.name && item.name.toLowerCase() === key);
                } else if (data[key]) {
                    linkData = data[key];
                }
            } catch (err) {
                console.error("Desktop Sync Error:", err);
            }

            const targetTitle = document.getElementById("target-title");
            const appSubtitle = document.getElementById("app-subtitle");
            const launchBtn = document.getElementById("launch-btn");
            const btnText = document.getElementById("btn-text");
            const btnSpinner = document.getElementById("btn-spinner");

            if (linkData) {
                const targetName = linkData.name || key.toUpperCase();
                const targetUrl = linkData.link || linkData.target_url;

                targetTitle.innerText = targetName.toUpperCase();
                appSubtitle.innerText = "Desktop Target Ready";
                btnText.innerText = "LAUNCH " + targetName.toUpperCase();
                btnSpinner.style.display = "none";
                launchBtn.disabled = false;

                launchBtn.onclick = () => {
                    if (targetUrl) {
                        // Desktop Browser Launch Logic
                        if (window.require) {
                            // Electron shell handler
                            const { shell } = window.require('electron');
                            shell.openExternal(targetUrl);
                        } else {
                            window.open(targetUrl, '_blank');
                        }
                    }
                };
            } else {
                targetTitle.innerText = key.toUpperCase();
                appSubtitle.innerText = "Target Not Mapped";
                btnText.innerText = "NO TARGET FOUND";
                btnSpinner.style.display = "none";
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
